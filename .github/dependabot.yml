version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR per ecosystem instead of a dozen - React, TanStack and the
      # build tooling all move together, and reviewing them together is safer.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tanstack:
        patterns:
          - "@tanstack/*"
      build-tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - nitro
          - lightningcss
          - typescript
      linting:
        patterns:
          - eslint
          - "eslint-*"
          - "@eslint/*"
          - typescript-eslint
          - prettier

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
